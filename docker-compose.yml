services:
  postgres:
    image: postgres:17-alpine
    container_name: payroll-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: payroll
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: '1234'
    ports:
      - '5433:5432'
    volumes:
      - payroll_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payroll -d payroll']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  payroll_postgres_data:
